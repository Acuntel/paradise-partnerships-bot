# Railway deploy config for paradise-partnerships-bot.
#
# ONE-SHOT MODE for the first deploy: cronSchedule is intentionally
# absent so the deploy runs cron_runner.py exactly once and exits.
# After we confirm 15 drafts land in Gmail, re-enable daily cron with:
#
#   cronSchedule = "0 13 * * *"   # 8am Chicago (CDT) = 13:00 UTC

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python cron_runner.py"
restartPolicyType = "NEVER"
